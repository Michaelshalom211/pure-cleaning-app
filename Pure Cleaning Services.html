<style>

.lg{position:fixed;left:12px;bottom:90px;z-index:7;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:800;color:var(--blue)}.empty{text-align:center;color:var(--mute);padding:34px 12px}.rm{background:var(--soft);border:1px solid var(--em)}
</style></head><body><div id="app"><div class="empty">Loading Pure Cleaning Services…</div></div><div id="ov"></div>
<script>

let L={users:[],me:null};try{Object.assign(L,JSON.parse(localStorage.getItem("pcs")||"{}"))}catch(e){}

const note=(o,t)=>W("notes",rid("n"),{cid:o.cid,oid:o.id,text:t,at:Date.now()});
async function init(){
 try{const u=await claude.use("user");adm=u?await u.canEdit():false}catch(e){}
 try{db=await claude.use("db");sample=await claude.use("sample")}catch(e){}
 const h=location.hash;R=h=="#rider"?"rider":adm&&h!="#app"?"admin":"cust";document.body.className=R=="admin"?"w":"";
 if(!db){$("#app").innerHTML=`<div class="empty"><h2>Sign in to claude.ai to open this app</h2></div>`;return}
 Object.keys(D).forEach(c=>db.collection(c).onSnapshot(s=>{D[c]=s.docs.map(d=>({id:d.id,...d.data()}));if(!$("#ov").innerHTML||R!="cust")render()},()=>{}));render()}
function render(){R=="admin"?admin():R=="rider"?rider():cust()}
/* ---------- customer ---------- */
function cust(){const u=U(),my=D.orders.filter(o=>u&&o.cid==u.id).sort((a,b)=>b.at-a.at),nt=D.notes.filter(n=>u&&n.cid==u.id).sort((a,b)=>b.at-a.at);let b="";
 if(V.t=="home"){const rem=SV.map(s=>{const o=my.filter(o=>o.sv==s.id&&o.st==5).sort((a,b)=>b.doneAt-a.doneAt)[0];if(!o)return"";const d=Math.floor((Date.now()-(o.doneAt||o.at))/864e5);return d>=s.f?`<div class="card rm"><b>Time for your next ${s.n.toLowerCase()}?</b><div class="mute">It has been ${d} days since your last one. We suggest every ${s.f==14?"2 weeks":"3 months"}.</div><button class="btn s g" style="margin-top:8px" onclick="book('${s.id}')">Book again</button></div>`:""}).join("");
  b=`<div class="hero"><h2>Fresh clothes, carpets and homes. Picked up and delivered.</h2><p>Serving Dar es Salaam, Dodoma, Arusha, Mwanza, Mbeya and Zanzibar. Pay by mobile money.</p><button class="btn" onclick="book('wash')">Book a cleaning</button></div><div class="sec">${rem}<h3 style="margin:6px 0 10px">Our services</h3><div class="sv">${SV.map(s=>`<button onclick="book('${s.id}')"><i>${s.e}</i><b>${s.n}</b><small>${s.d}</small><div class="pr">${T(pp(s.id))} per ${s.u}</div></button>`).join("")}</div><p class="mute" style="margin-top:12px">Pickup and delivery: ${T(FEE)} per order.</p></div>`}
 if(V.t=="orders")b=!u?need("see your orders"):`<div class="sec"><h2 style="margin:8px 0">My orders</h2>${my.length?my.map(o=>`<div class="card"><div class="row"><b>${esc(o.id)}</b><span class="pill ${o.payStatus=="confirmed"?"ok":o.payStatus=="failed"?"bd":"wn"}">${o.payStatus=="confirmed"?"Paid":o.payStatus=="failed"?"Payment failed":"Checking payment"}</span></div><div>${esc(o.svn)} × ${o.qty} · ${T(o.total)}</div><div class="mute">${esc(o.date)}, ${esc(o.slot)} · ${esc(o.zone)}, ${esc(o.region)}</div><div style="margin-top:10px">${ST.map((s,i)=>`<div class="st ${i<=o.st?"d":""}"><i class="dot"></i><span>${s}</span></div>`).join("")}</div>${o.riderId?(r=>r?`<div class="mute">Rider: ${esc(r.name)} · <a href="tel:${esc(r.phone)}" style="color:var(--blue)">${esc(r.phone)}</a></div>`:"")(D.riders.find(r=>r.id==o.riderId)):""}</div>`).join(""):`<div class="empty">No orders yet. Book your first cleaning.</div>`}</div>`;
 if(V.t=="alerts")b=!u?need("see alerts"):`<div class="sec"><h2 style="margin:8px 0">Alerts</h2><p class="mute">Each update is also sent by SMS to your phone.</p>${nt.length?nt.map(n=>`<div class="card"><div>🔔 ${esc(n.text)}</div><small class="mute">${esc(n.oid||"")} · ${new Date(n.at).toLocaleString("en-GB",{dateStyle:"medium",timeStyle:"short"})}</small></div>`).join(""):`<div class="empty">No alerts yet.</div>`}</div>`;
 if(V.t=="acct")b=!u?need("manage your account"):`<div class="sec"><h2>${esc(u.name)}</h2><p class="mute" style="margin:4px 0 14px">${esc(u.id)}</p><button class="btn o" onclick="L.me=null;sv();V.t='home';render()">Log out</button><p class="mute" style="margin-top:14px;font-size:12px">Demo: login details stay on this device. A live version needs a secure server and SMS verification.</p></div>`;
 $("#app").innerHTML=`<header><div class="logo hd">Pure <b>Cleaning</b> Services</div>${u?`<span class="mute">Hi, ${esc(u.name.split(" ")[0])}</span>`:`<button class="btn s" onclick="AM='login';authS()">Log in</button>`}</header>${b}<button class="fab" onclick="chat()">💬 Ask Pure AI</button><nav>${[["home","🏠","Home"],["orders","📋","Orders"],["alerts","🔔","Alerts"],["acct","👤","Account"]].map(([k,i,l])=>`<button class="${V.t==k?"on":""}" onclick="V.t='${k}';render();scrollTo(0,0)"><span>${i}</span>${l}</button>`).join("")}</nav>`}
const need=w=>`<div class="empty"><p>Log in to ${w}.</p><button class="btn" style="margin-top:12px" onclick="AM='login';authS()">Log in or sign up</button></div>`;
function authS(){sheet(`<h2>Welcome</h2><div class="tabs" style="padding:8px 0"><button class="${AM=="login"?"on":""}" onclick="AM='login';authS()">Log in</button><button class="${AM=="signup"?"on":""}" onclick="AM='signup';authS()">Sign up</button></div>${AM=="signup"?`<label>Full name</label><input id="an">`:""}<label>Phone (+255…) or email</label><input id="ai" placeholder="+255 7XX XXX XXX"><label>Password (6+ characters)</label><input id="ap" type="password"><div class="err" id="ae"></div><button class="btn f" onclick="auth()">${AM=="login"?"Log in":"Create account"}</button>`)}
function auth(){const raw=$("#ai").value.trim(),pw=$("#ap").value,E=m=>$("#ae").textContent=m,ph=phone(raw),em=/^\S+@\S+\.\S+$/.test(raw)?raw.toLowerCase():null,id=ph||em;
 if(!id)return E("Enter a valid Tanzanian phone (0712 345 678) or an email.");if(pw.length<6)return E("Password needs 6 or more characters.");
 const h=btoa(unescape(encodeURIComponent(pw))),u=L.users.find(u=>u.id==id);
 if(AM=="signup"){const n=$("#an").value.trim();if(!n)return E("Enter your name.");if(u)return E("This account exists. Log in instead.");L.users.push({id,name:n,pw:h,phone:ph||""});L.me=id}else{if(!u||u.pw!=h)return E("Wrong phone/email or password.");L.me=id}
 sv();closeS();render()}
function book(id){B={sv:id||"wash",qty:1,region:"Dar es Salaam",zone:"",addr:"",date:new Date(Date.now()+864e5-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10),slot:SLOTS[0],...B,sv:id||B.sv};bookS()}
function rdB(){if(!$("#bq"))return;B.qty=+$("#bq").value;B.addr=$("#ba").value;B.date=$("#bd").value;B.slot=$("#bt").value;B.region=$("#br").value;B.zone=$("#bz")?.value||B.zone}
const tot=()=>B.qty*pp(B.sv)+FEE;
function bookS(){rdB();const s=SV.find(x=>x.id==B.sv),z=REG[B.region];if(!z.includes(B.zone))B.zone=z[0];
 sheet(`<h2>Book a cleaning</h2><label>Service</label><select onchange="rdB();B.sv=this.value;bookS()">${SV.map(x=>`<option value="${x.id}" ${x.id==B.sv?"selected":""}>${x.n}</option>`).join("")}</select><label>How many ${s.u}s? (${T(pp(s.id))} each)</label><input id="bq" type="number" min="1" max="500" value="${B.qty}" oninput="rdB();$('#tt').textContent=T(tot())"><label>Region</label><select id="br" onchange="rdB();B.zone='';bookS()">${Object.keys(REG).map(r=>`<option ${r==B.region?"selected":""}>${r}</option>`).join("")}</select><label>Neighbourhood</label><select id="bz">${z.map(x=>`<option ${x==B.zone?"selected":""}>${x}</option>`).join("")}</select><label>Street or landmark</label><input id="ba" value="${esc(B.addr)}" placeholder="House number, street, near…"><label>Pickup date</label><input id="bd" type="date" value="${B.date}"><label>Pickup time</label><select id="bt">${SLOTS.map(x=>`<option value="${x}" ${x==B.slot?"selected":""}>${x}</option>`).join("")}</select><div class="row" style="margin:14px 0 4px"><span class="mute">Includes ${T(FEE)} pickup and delivery</span><b id="tt" style="font-size:20px;color:var(--em)">${T(tot())}</b></div><div class="err" id="be"></div><button class="btn f" onclick="toPay()">Continue to payment</button>`)}
function toPay(){rdB();if(!(B.qty>=1))return $("#be").textContent="Enter a quantity of 1 or more.";if(B.addr.trim().length<3)return $("#be").textContent="Enter your street or landmark.";if(!B.date||B.date<new Date().toISOString().slice(0,10))return $("#be").textContent="Pick a date from today onward.";
 if(!U())return authS();const u=U();
 sheet(`<h2>Pay with mobile money</h2><div class="net" style="margin-top:10px">${NET.map(n=>`<button class="${NW==n[0]?"on":""}" onclick="NW='${n[0]}';[...this.parentNode.children].forEach(b=>b.classList.toggle('on',b==this))">${n[1]}<small class="mute" style="display:block">${n[2]}</small></button>`).join("")}</div><label>Mobile money number</label><input id="mp" value="${u.phone}" inputmode="tel" placeholder="+255 7XX XXX XXX"><div class="row" style="margin:14px 0"><b>Total</b><b style="color:var(--em);font-size:20px">${T(tot())}</b></div><div class="err" id="be"></div><button class="btn f" onclick="stk()">Pay now</button><button class="btn o f" style="margin-top:8px" onclick="bookS()">Back</button>`)}
function stk(){const m=phone($("#mp").value);if(!m)return $("#be").textContent="Enter a valid mobile money number.";const n=NET.find(x=>x[0]==NW);
 sheet(`<h2>Approve on your phone</h2><div class="card" style="margin-top:10px"><p>A payment request of <b>${T(tot())}</b> was sent to <b>${m}</b> on ${n[1]}.</p><ol class="mute" style="margin:8px 0 0 18px"><li>Check your phone for the prompt.</li><li>Enter your PIN.</li><li>Return here and confirm.</li></ol><p class="mute" style="margin-top:8px">No prompt? Dial <b>${n[2]}</b> and pay business number <b>PURE-0042</b>.</p></div><button class="btn g f" id="cf" onclick="place('${m}')">I have approved the payment</button><p class="mute" style="font-size:12px;margin-top:10px">Demo mode: no money moves. A live version uses a gateway such as Selcom, AzamPay or ClickPesa with a callback webhook.</p>`)}
async function place(m){const b=$("#cf");b.disabled=true;b.textContent="Confirming…";const u=U(),s=SV.find(x=>x.id==B.sv),id="PCS"+Math.floor(1e5+Math.random()*9e5);
 await new Promise(r=>setTimeout(r,1500));const o={id,cid:u.id,name:u.name,phone:m,sv:s.id,svn:s.n,qty:B.qty,total:tot(),region:B.region,zone:B.zone,addr:B.addr.trim(),date:B.date,slot:B.slot,net:NW,payRef:"TXN"+Math.floor(1e7+Math.random()*9e7),payStatus:"pending",st:0,riderId:"",at:Date.now()};
 if(await W("orders",id,o)){await note(o,`${id}: Order received. We are checking your payment.`);closeS();V.t="orders";B={};render();toast("Order placed")}else{b.disabled=false;b.textContent="Try again"}}
async function chat(){if(!CH.length)CH=[{r:"ai",t:"Habari! I’m Pure AI. Ask me about prices, booking, pickup times or your order status. A human agent will follow up during office hours."}];chatS()}
function chatS(){sheet(`<h2>Pure AI assistant</h2><p class="mute">Available 24/7. For payments disputes, our team replies in office hours.</p><div class="chat" id="ch">${CH.map(m=>`<div class="msg ${m.r=="me"?"me":"ai"}">${esc(m.t)}</div>`).join("")}</div><div class="row" style="margin:6px 0">${["Prices","Track my order","How does pickup work?"].map(q=>`<button class="btn o s" onclick="ask('${q}')">${q}</button>`).join("")}</div><div class="row" style="flex-wrap:nowrap"><input id="cq" placeholder="Type your question" onkeydown="if(event.key=='Enter')ask()"><button class="btn" onclick="ask()">Send</button></div>`);const c=$("#ch");c.scrollTop=c.scrollHeight}
async function ask(q){q=q||$("#cq").value.trim();if(!q)return;CH.push({r:"me",t:q});CH.push({r:"ai",t:"Thinking…"});chatS();const u=U(),my=D.orders.filter(o=>u&&o.cid==u.id).slice(0,5).map(o=>`${o.id}: ${o.svn}, status ${ST[o.st]}, payment ${o.payStatus}, pickup ${o.date} ${o.slot}`).join("\n")||"none (customer may be logged out)";let a;
 const P=`You are Pure AI, the assistant for Pure Cleaning Services in Tanzania. Be warm, brief (under 90 words), plain English or Kiswahili to match the customer.${LANG=="sw"?" The app is set to Kiswahili, so reply in Kiswahili unless the customer writes in English.":""} Facts: services and prices: ${SV.map(s=>`${s.n} ${T(pp(s.id))} per ${s.u}`).join("; ")}. Pickup and delivery fee ${T(FEE)} per order. Regions: ${Object.entries(REG).map(([r,z])=>r+" ("+z.join(", ")+")").join("; ")}. Payment: Vodacom M-Pesa, Airtel Money, Mixx by Yas, HaloPesa. Order stages: ${ST.join(", ")}. Reminders: laundry every 2 weeks, carpets and deep cleaning every 3 months. Human admin office hours 8am to 6pm; outside those hours you handle FAQs, booking guidance, pricing and tracking. Never invent prices, discounts or times. For refunds, complaints or payment problems, take their order number and say the team will follow up. Customer orders:\n${my}\n\nConversation:\n${CH.slice(0,-2).map(m=>(m.r=="me"?"Customer: ":"Assistant: ")+m.t).join("\n")}\nCustomer: ${q}\nAssistant:`;
 try{if(!sample)throw 0;a=(await sample(P)).text.trim()}catch(e){a=/price|bei|cost/i.test(q)?SV.map(s=>`${s.n}: ${T(pp(s.id))} per ${s.u}`).join("\n")+`\nPickup and delivery: ${T(FEE)}.`:/track|status|order/i.test(q)?"Open the Orders tab to see each stage of your order, from Booked to Completed.":/pick|deliver/i.test(q)?"Choose a date and time when you book. A rider collects your items, and we deliver them back clean.":"I can help with prices, booking and tracking. For anything else, our team will reply in office hours."}
 CH[CH.length-1]={r:"ai",t:a};W("ailogs",rid("a"),{cid:u?.id||"guest",name:u?.name||"Guest",q,a,at:Date.now()});chatS()}
